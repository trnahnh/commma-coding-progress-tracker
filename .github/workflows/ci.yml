name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commma
          # Throwaway container that lives for one CI run: trust auth, so no
          # password sits in this file or in the connection URL below.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: commma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://commma@localhost:5432/commma_test
      TEST_REDIS_URL: redis://localhost:6379/9
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate test database
        run: pnpm --filter @commma/db migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "*.md"
